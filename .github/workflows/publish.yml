name: Publish to PyPI

# Fires on any version tag (v0.1.0, v0.2.0, ...). See RELEASING.md for the
# full release checklist. Uses PyPI "trusted publishing" (OIDC) — no API
# token is stored anywhere, in this repo or on PyPI. One-time setup on
# PyPI's side is required before the first release; see RELEASING.md.

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/claude-orchestrator/
    permissions:
      id-token: write  # required for trusted publishing — no secrets.PYPI_TOKEN anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
